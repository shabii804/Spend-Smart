<svg xmlns="http://www.w3.org/200/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C6CFF"/>
      <stop offset="100%" stop-color="#9B5CFF"/>
    </linearGradient>
    <radialGradient id="highlight" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Squircle background -->
  <rect width="64" height="64" rx="18" fill="url(#bg)"/>
  <rect width="64" height="64" rx="18" fill="url(#highlight)"/>
  <!-- Wallet body -->
  <rect x="18" y="22" width="28" height="20" rx="5" fill="white"/>
  <!-- Wallet flap -->
  <rect x="18" y="22" width="28" height="7" rx="5" fill="white" fill-opacity="0.85"/>
  <!-- Cyan coin-dot clasp -->
  <circle cx="39" cy="32" r="3.5" fill="#22D3EE"/>
  <!-- Growth spark -->
  <path d="M 25 26 L 28 23 L 31 26" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
