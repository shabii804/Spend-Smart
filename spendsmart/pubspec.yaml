name: spendsmart
description: "SpendSmart — a premium student expense-tracking app. Frontend only, sample data managed with Provider."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <3.6.0"
  flutter: ">=3.22.0 <3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          style: italic

# ── Launcher Icons ──
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/icon.png"
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#0B0F1A"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  adaptive_icon_monochrome: "assets/images/icon_monochrome.png"
  min_sdk_android: 21

# ── Native Splash ──
# Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B0F1A"
  image: "assets/images/splash_logo.png"
  android_12:
    image: "assets/images/splash_logo.png"
    color: "#0B0F1A"
  android: true
  ios: true
  web: false
