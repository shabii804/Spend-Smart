<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C6CFF"/>
      <stop offset="100%" stop-color="#9B5CFF"/>
    </linearGradient>
    <radialGradient id="hl" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feFlood flood-color="#7C6CFF" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <rect width="512" height="512" rx="143" fill="url(#bg)"/>
    <rect width="512" height="512" rx="143" fill="url(#hl)"/>
    <!-- Wallet body -->
    <rect x="144" y="176" width="224" height="160" rx="40" fill="white"/>
    <!-- Wallet flap -->
    <rect x="144" y="176" width="224" height="56" rx="40" fill="white" fill-opacity="0.85"/>
    <!-- Cyan coin-dot clasp -->
    <circle cx="312" cy="256" r="28" fill="#22D3EE"/>
    <!-- Growth spark -->
    <path d="M 200 208 L 224 184 L 248 208" stroke="#22D3EE" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
